name: Build Corolla Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/corolla/launcher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CorollaLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.4" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.corolla.launcher"
              compileSdk = 33
              defaultConfig {
                  applicationId = "com.corolla.launcher"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0.0"
                  ndk {
                      abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a"))
                  }
              }
              signingConfigs {
                  getByName("debug") {
                      v1SigningEnabled = true
                      v2SigningEnabled = true
                  }
              }
              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                      isDebuggable = true
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.10.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.9.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.cardview:cardview:1.0.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Corolla Launcher"
                  android:theme="@style/Theme.CorollaLauncher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:clearTaskOnLaunch="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/corolla/launcher/MainActivity.kt
          package com.corolla.launcher

          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.KeyEvent
          import android.widget.Button
          import android.widget.ImageButton
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private var isPlaying = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  setupButtons()
                  setupMedia()
              }

              private fun setupButtons() {
                  findViewById<Button>(R.id.btnBluetooth).setOnClickListener {
                      safeLaunch(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                  }
                  findViewById<Button>(R.id.btnRadio).setOnClickListener {
                      val pm = packageManager
                      val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                      val apps = pm.queryIntentActivities(intent, 0)
                      val radioApp = apps.firstOrNull {
                          val pkg = it.activityInfo.packageName.lowercase()
                          pkg.contains("radio") || pkg.contains("fm")
                      }
                      if (radioApp != null) {
                          safeLaunch(pm.getLaunchIntentForPackage(radioApp.activityInfo.packageName))
                      } else {
                          Toast.makeText(this, "Radio app not found", Toast.LENGTH_SHORT).show()
                      }
                  }
                  findViewById<Button>(R.id.btnNav).setOnClickListener {
                      val geoIntent = Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=")).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      if (geoIntent.resolveActivity(packageManager) != null) {
                          safeLaunch(geoIntent)
                      } else {
                          val nav = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MAPS)
                          safeLaunch(nav)
                      }
                  }
                  findViewById<Button>(R.id.btnMusic).setOnClickListener {
                      val music = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC)
                      safeLaunch(music)
                  }
                  findViewById<Button>(R.id.btnApps).setOnClickListener {
                      val pm = packageManager
                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }
                      val appList: List<ResolveInfo> = pm.queryIntentActivities(mainIntent, 0)
                          .filter { it.activityInfo.packageName != packageName }
                          .sortedBy { it.loadLabel(pm).toString() }
                      val appNames = appList.map { it.loadLabel(pm).toString() }.toTypedArray()

                      AlertDialog.Builder(this)
                          .setTitle("All Applications")
                          .setItems(appNames) { _, which ->
                              val pkg = appList[which].activityInfo.packageName
                              safeLaunch(pm.getLaunchIntentForPackage(pkg))
                          }
                          .setNegativeButton("Close", null)
                          .show()
                  }
              }

              private fun setupMedia() {
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val btnPlayPause = findViewById<ImageButton>(R.id.btnPlayPause)

                  btnPlayPause.setOnClickListener {
                      isPlaying = !isPlaying
                      btnPlayPause.setImageResource(
                          if (isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play
                      )
                      sendMediaKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE, audioManager)
                  }
                  findViewById<ImageButton>(R.id.btnPrev).setOnClickListener {
                      sendMediaKey(KeyEvent.KEYCODE_MEDIA_PREVIOUS, audioManager)
                  }
                  findViewById<ImageButton>(R.id.btnNext).setOnClickListener {
                      sendMediaKey(KeyEvent.KEYCODE_MEDIA_NEXT, audioManager)
                  }
              }

              private fun sendMediaKey(code: Int, am: AudioManager) {
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
              }

              private fun safeLaunch(intent: Intent?) {
                  if (intent == null) return
                  try {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  } catch (_: Exception) {
                      Toast.makeText(this, "App not available", Toast.LENGTH_SHORT).show()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {}
          }
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0E0E10"
              android:paddingStart="24dp"
              android:paddingEnd="24dp"
              android:paddingTop="16dp"
              android:paddingBottom="12dp">

              <LinearLayout
                  android:id="@+id/clockContainer"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:orientation="vertical"
                  android:gravity="center_vertical|start"
                  android:paddingStart="16dp"
                  app:layout_constraintHorizontal_weight="1"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toStartOf="@+id/cardNowPlaying"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toTopOf="@+id/bottomDock">

                  <TextClock
                      android:id="@+id/textClock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:format12Hour="h:mm a"
                      android:format24Hour="HH:mm"
                      android:textColor="#FFFFFF"
                      android:textSize="72sp"
                      android:textStyle="bold" />

                  <TextClock
                      android:id="@+id/dateClock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:format12Hour="EEEE, MMMM d"
                      android:format24Hour="EEEE, MMMM d"
                      android:textColor="#9E9EA7"
                      android:textSize="22sp" />
              </LinearLayout>

              <androidx.cardview.widget.CardView
                  android:id="@+id/cardNowPlaying"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:layout_marginStart="24dp"
                  app:cardBackgroundColor="#18181C"
                  app:cardCornerRadius="16dp"
                  app:cardElevation="0dp"
                  app:layout_constraintHorizontal_weight="1.2"
                  app:layout_constraintStart_toEndOf="@+id/clockContainer"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toTopOf="@+id/bottomDock">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:padding="20dp"
                      android:gravity="center">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Now Playing"
                          android:textColor="#FFFFFF"
                          android:textSize="22sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Audio Ready"
                          android:textColor="#9E9EA7"
                          android:textSize="16sp" />

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center"
                          android:layout_marginTop="16dp">

                          <ImageButton
                              android:id="@+id/btnPrev"
                              android:layout_width="80dp"
                              android:layout_height="80dp"
                              android:background="?attr/selectableItemBackgroundBorderless"
                              android:src="@android:drawable/ic_media_previous"
                              app:tint="#FFFFFF" />

                          <ImageButton
                              android:id="@+id/btnPlayPause"
                              android:layout_width="80dp"
                              android:layout_height="80dp"
                              android:layout_marginStart="20dp"
                              android:layout_marginEnd="20dp"
                              android:background="@drawable/circle_accent"
                              android:src="@android:drawable/ic_media_play"
                              app:tint="#FFFFFF" />

                          <ImageButton
                              android:id="@+id/btnNext"
                              android:layout_width="80dp"
                              android:layout_height="80dp"
                              android:background="?attr/selectableItemBackgroundBorderless"
                              android:src="@android:drawable/ic_media_next"
                              app:tint="#FFFFFF" />
                      </LinearLayout>
                  </LinearLayout>
              </androidx.cardview.widget.CardView>

              <LinearLayout
                  android:id="@+id/bottomDock"
                  android:layout_width="match_parent"
                  android:layout_height="88dp"
                  android:orientation="horizontal"
                  android:layout_marginTop="14dp"
                  android:weightSum="5"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <Button
                      android:id="@+id/btnBluetooth"
                      style="@style/CarLauncherButton"
                      android:text="Bluetooth"
                      android:drawableTop="@drawable/ic_bluetooth" />

                  <Button
                      android:id="@+id/btnRadio"
                      style="@style/CarLauncherButton"
                      android:text="Radio"
                      android:drawableTop="@drawable/ic_radio" />

                  <Button
                      android:id="@+id/btnNav"
                      style="@style/CarLauncherButton"
                      android:text="Navigation"
                      android:drawableTop="@drawable/ic_nav" />

                  <Button
                      android:id="@+id/btnMusic"
                      style="@style/CarLauncherButton"
                      android:text="Music"
                      android:drawableTop="@drawable/ic_music" />

                  <Button
                      android:id="@+id/btnApps"
                      style="@style/CarLauncherButton"
                      android:text="Apps"
                      android:drawableTop="@drawable/ic_apps" />
              </LinearLayout>
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.CorollaLauncher" parent="Theme.MaterialComponents.NoActionBar">
                  <item name="android:windowBackground">#0E0E10</item>
                  <item name="android:statusBarColor">#0E0E10</item>
                  <item name="android:navigationBarColor">#0E0E10</item>
                  <item name="android:windowTranslucentNavigation">false</item>
              </style>
              <style name="CarLauncherButton">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">match_parent</item>
                  <item name="android:layout_weight">1</item>
                  <item name="android:layout_marginStart">6dp</item>
                  <item name="android:layout_marginEnd">6dp</item>
                  <item name="android:backgroundTint">#18181C</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textSize">14sp</item>
                  <item name="android:textStyle">bold</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="bg_main">#0E0E10</color>
              <color name="bg_card">#18181C</color>
              <color name="accent_orange">#E8590C</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Corolla Launcher</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/circle_accent.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#E8590C" />
              <size android:width="80dp" android:height="80dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_bluetooth.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#E8590C" android:pathData="M17.71,7.71L12,2h-1v7.59L6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 11,14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13,5.83l1.88,1.88L13,9.59V5.83zm1.88,10.46L13,18.17v-3.76l1.88,1.88z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_radio.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#E8590C" android:pathData="M3.24,6.15C2.51,6.43 2,7.17 2,8v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8c0,-1.1 -0.9,-2 -2,-2H8.3l8.26,-3.34L15.88,1 3.24,6.15zM7,20c-1.66,0 -3,-1.34 -3,-3s1.34,-3 3,-3 3,1.34 3,3 -1.34,3 -3,3zm13,-8h-2v-2h-2v2H4V8h16v4z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#E8590C" android:pathData="M12,2L4.5,20.29l0.71,0.71L12,18l6.79,3 0.71,-0.71z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_music.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#E8590C" android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_apps.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#E8590C" android:pathData="M4,8h4V4H4v4zm6,12h4v-4h-4v4zm-6,0h4v-4H4v4zm0,-6h4v-4H4v4zm6,0h4v-4h-4v4zm6,-10v4h4V4h-4zm-6,4h4V4h-4v4zm6,6h4v-4h-4v4zm0,6h4v-4h-4v4z"/>
          </vector>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CorollaLauncher-APK
          path: app/build/outputs/apk/debug/*.apk
